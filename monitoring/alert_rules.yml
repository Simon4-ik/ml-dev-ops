groups:
  - name: triton_alerts
    rules:
      - alert: HighInferenceLatency
        expr: rate(nv_inference_compute_infer_duration_us[1m]) / rate(nv_inference_request_success[1m]) > 500000
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "High inference latency detected (Model: {{ $labels.model }})"
          description: "Average inference latency is above 500ms for the last 30s."

      - alert: HighRequestFailureRate
        expr: rate(nv_inference_request_failure[1m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Inference failures detected (Model: {{ $labels.model }})"
          description: "Model {{ $labels.model }} has failing inference requests for more than 1 minute."
